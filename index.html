<!DOCTYPE html>
<html lang="eng">
  <head>
    <link rel="manifest" href="manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">  <!-- old ver -->
    <meta name="mobile-web-app-capable" content="yes">        <!-- new ver -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Studentkortet" />
    <link rel="apple-touch-icon" href="icon.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>STUK</title>

    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;    /* Safari */
        -moz-user-select: none;       /* Firefox */
        -ms-user-select: none;        /* IE10+/Edge */
        user-select: none;            /* Standard */
        -webkit-touch-callout: none;  /* iOS long-press menu */
      }

      :root{
        --bar-height-base: 3.0rem;
      }

      html, body {
        margin: 0;
        height: 100dvh;
        height: 100vh; /* fallback */
        overflow: hidden;

      }

      body {
        background:#555555;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: calc(var(--bar-height-base) + env(safe-area-inset-bottom)); /* flex centering accounts for the fixed bottom bar */  
        box-sizing: border-box;
      }

      .floating-image {
        position: fixed;
        left: 50%;
        top: 50%;
        width: clamp(120px, 8vw, 160px);
        height: auto;
        pointer-events: none;         
        transform: translate(-50%, -50%);
        animation: drift 15s linear forwards;
      }

       @keyframes drift {
        to {
          transform: translate(-50%, -50%) translate(var(--x), var(--y));
        }
      }

      .card-container {
        perspective: 1000px;
        z-index: 1;
      }

      .card {
        width: 90vw;
        height: calc(90vw * (1047/659)); /* Relación 8:5 (alto = ancho * 8/5 ≈ 1.6) */
        max-width: calc(75vh / (1047/659)); /* que no sobrepase la pantalla */
        max-height: 75vh;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.3s;
        cursor: pointer;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 550;
        text-align: left;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .content-back {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: rotate(90deg);
      }

      .card-front-image {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .white-box-large { position: absolute; top: 2%; left: 20%; width: 25%; height: 30%; background-color: white; z-index: 2; }
      .white-box-mini  { position: absolute; top: 2%; left: 13%; width: 7%;  height: 14%; background-color: white; z-index: 2; }
      .white-box-small { position: absolute; top: 2%; left: 2%;  width: 11%; height: 35%; background-color: white; z-index: 2; }
      .grey-box        { position: absolute; top: 79.5%; left: 25.5%; width: 3%;  height: 15.1%; background-color: #e4e4e2; z-index: 2; }


      .card-front-text {
        position: absolute;
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }


      .card-front-name            { top: 30.30%; left: 40.0%; font-size: clamp(0.85rem, 0.83vw, 1.05rem); }
      .card-front-number          { top: 30.50%; left: 34.0%; font-size: clamp(0.75rem, 0.73vw, 0.95rem); }
      .card-front-number-xs-id    { top: 31.05%; left: 27.5%; font-size: clamp(0.55rem, 0.52vw, 0.75rem); }
      .card-front-number-xs-vote  { top: 31.05%; left: 22.5%; font-size: clamp(0.55rem, 0.52vw, 0.75rem); }
      .card-front-term            { top: 30.50%; left: 16.5%; font-size: clamp(0.85rem, 0.84vw, 1.05rem); }
      .card-front-number-due      { top: 30.80%; left: 10.0%; font-size: clamp(0.72rem, 0.68vw, 0.95rem); }
      .card-front-number-due-mini { top: 105.7%; left: 27.0%; font-size: clamp(0.42rem, 0.405vw, 0.6rem); color: #4e4e4e; }


      .card-back-image {
        transform: rotate(-90deg);
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .bottom-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--bar-height-base);
        background: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 0.5rem calc(env(safe-area-inset-bottom)) 1rem; 
        box-sizing: border-box;
        z-index: 10;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 450;
      }

      .bottom-left {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;

      }

      .bottom-right {
        display: flex;
        align-items: center;
        gap: 0.1rem;
      }

      .icon-btn {
        background: transparent;
        border: none;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;   /* Make touch targets large enough for phones */
        min-height: 44px;
      }

      .icon-btn img {
        width: 28px;
        height: 28px;
        display: block;
      }

      .overlay-shadow {
        position: fixed;
        inset: 0;
        display: none; 
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.35);
        z-index: 20; 
      }

      .overlay-shadow.open {
        display: flex; /* qr.js accesses and adds attaches this class to overlay-shadow */ 
      }

      .qr-code-container {
        position: relative;
        width: min(90vw, calc(75vh / (1047/659)));
        aspect-ratio: 1 / 1.2;
        background: #f5f5f5;
        border-radius: 5px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
      }

      .qr-pink-text {
        position: absolute;
        top: 7%;
        font-size: clamp(1.4rem, 1.5vw, 1.6rem);
        font-weight: 400;
        color: #fb2a5f;
        z-index: 22;
      }

      .qr-code-white-box {
        position: absolute;
        bottom: 10%;
        width: 80%;
        height: 67%;
        background: white;
        z-index: 22;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
        text-align: center;
      }

      .qr-error-message {
        color: #333;
        font-size: clamp(0.95rem, 1.8vw, 1.15rem);
        margin: 0;
        line-height: 1.3;
      }
      

    /* left for optimizing:
    - slower floaters (adaptive)
    */




    </style>
  </head>
  <body>
    <script src="floaters.js"></script>
    <script src="qr.js"></script>
   
    <div id="qr-overlay" class="overlay-shadow" aria-hidden="true">
      <div class="qr-code-container" aria-modal="true" aria-label="QR code"> 
        <div class="qr-pink-text">QR-kod för ditt kort</div>
        <div class="qr-code-white-box">
          <div class="qr-error-message">QR-koden kunde inte genereras på grund av ett tekniskt fel. <br> <br> Försök igen om en stund.</div>
        </div>
      </div>
    </div>

    <div class="card-container">
      <div class="card" onclick="this.classList.toggle('flipped')">
        <div class="card-side">
          <div class="card-front-text card-front-name">Adriana Escamilla Fernández</div>
          <div class="card-front-text card-front-number">970809-8489</div>
          <div class="card-front-text card-front-number-xs-id">6038 0224 4731 4836</div>
          <div class="card-front-text card-front-number-xs-vote">Valkod: 800085</div>
          <div class="card-front-text card-front-term">HT 2025</div>
          <div class="card-front-text card-front-number-due">GILTIGT TILL: 2026-02-15</div>
          <div class="card-front-text card-front-number-due-mini">GILTIGT TILL: 2026-02-15</div>
          <div class="white-box-large"></div>
          <div class="white-box-mini"></div>
          <div class="white-box-small"></div>
          <div class="grey-box"></div>
          <img src="images/card-front.jpg" alt="Card Front" class="card-front-image"/>
        </div>
        <div class="card-side card-back">
            <div class="content-back">
                <img src="images/card-back.jpg" alt="Card Back" class="card-back-image"/>
            </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar" role="toolbar" aria-label="Bottom actions">
      <div class="bottom-left" onclick="console.log('close clicked')">Stäng</div>

      <div class="bottom-right">
        <button class="icon-btn" aria-label="QR" type="button" onclick="console.log('QR clicked')">
          <img src="images/QR.png" alt="QR"/>
        </button>
        <button class="icon-btn" aria-label="refresh" type="button" onclick="console.log('refresh clicked')">
          <img src="images/refresh-arrow.png" alt="refresh"/>
        </button>
      </div>
    </div>
    </body>
</html>
