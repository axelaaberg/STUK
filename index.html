<!DOCTYPE html>
<html lang="eng">
  <head>
    <link rel="manifest" href="manifest.json" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes">  <!--old ver-->
    <meta name="mobile-web-app-capable" content="yes">        <!-- new ver -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Studentkortet" />
    <link rel="apple-touch-icon" href="icon.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>STUK</title>

    <style>
      :root{
        --bar-height-base: 3.75rem;
        --bar-bg: #ffffff;
        --bar-pad: 1rem;
        --card-gap-bottom: 0.75rem;
      }

      html, body {
        margin: 0;
        height: 100dvh;
        height: 100vh; /* fallback */
        overflow: hidden;

      }

      body {
        background:#555555;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .floating-image {
        position: fixed;
        left: 50%;
        top: 50%;
        width: clamp(120px, 8vw, 160px);
        height: auto;
        pointer-events: none;         
        transform: translate(-50%, -50%);
        animation: drift 15s linear forwards;
      }

       @keyframes drift {
        to {
          transform: translate(-50%, -50%) translate(var(--x), var(--y));
        }
      }
      .card-container {
        perspective: 1000px;
        z-index: 1;
        /* keep the card visible above the page bottom bar and safe area */
        margin-bottom: calc(var(--bar-height-base) + env(safe-area-inset-bottom) + var(--card-gap-bottom));
      }

      .card {
        width: 90vw;
        height: calc(90vw * (1047/659)); /* Relación 8:5 (alto = ancho * 8/5 ≈ 1.6) */
        max-width: calc(75vh / (1047/659)); /* que no sobrepase la pantalla */
        max-height: 75vh;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.3s;
        cursor: pointer;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 550;
        text-align: left;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .content-back {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: rotate(90deg);
      }

      .card-front-image {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .white-box-large { position: absolute; top: 2%; left: 20%; width: 25%; height: 30%; background-color: white; z-index: 2; }
      .white-box-mini  { position: absolute; top: 2%; left: 13%; width: 7%;  height: 14%; background-color: white; z-index: 2; }
      .white-box-small { position: absolute; top: 2%; left: 2%;  width: 11%; height: 35%; background-color: white; z-index: 2; }
      .grey-box        { position: absolute; top: 79.5%; left: 25.5%; width: 3%;  height: 15.1%; background-color: #e4e4e2; z-index: 2; }

      /* Use clamp for responsive font sizing: preserves look on large screens and scales down on phones */
      .card-front-name {
        position: absolute;
        top: 30.3%;
        left: 40%;
        font-size: clamp(0.85rem, 0.83vw, 1.05rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-number {
        position: absolute;
        top: 30.5%;
        left: 34%;
        font-size: clamp(0.75rem, 0.73vw, 0.95rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-number-xs-id {
        position: absolute;
        top: 31.05%;
        left: 27.5%;
        font-size: clamp(0.55rem, 0.52vw, 0.75rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-number-xs-vote {
        position: absolute;
        top: 31.05%;
        left: 22.5%;
        font-size: clamp(0.55rem, 0.52vw, 0.75rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-term {
        position: absolute;
        top: 30.5%;
        left: 16.5%;
        font-size: clamp(0.85rem, 0.84vw, 1.05rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-number-due {
        position: absolute;
        top: 30.8%;
        left: 10%;
        font-size: clamp(0.72rem, 0.68vw, 0.95rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-number-due-mini {
        position: absolute;
        color: #4e4e4e;
        top: 105.7%;
        left: 27%;
        font-size: clamp(0.42rem, 0.405vw, 0.6rem);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-back-image {
        transform: rotate(-90deg);
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .bottom-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--bar-height-base);
        background: var(--bar-bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--bar-pad) calc(env(safe-area-inset-bottom)); 
        box-sizing: border-box;
        z-index: 1200;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 450;
      }

      .bottom-left {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;

      }

      .bottom-right {
        display: flex;
        align-items: center;
        gap: 0.6rem;

      }

      .icon-btn {
        background: transparent;
        border: none;
        padding: 8px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;   /* Make touch targets large enough for phones */
        min-height: 44px;
      }

      .icon-btn img {
        width: 24px;
        height: 24px;
        display: block;
      }


    </style>
  </head>
  <body>
    <script src="floaters.js"></script>

    <div class="card-container">
      <div class="card" onclick="this.classList.toggle('flipped')">
        <div class="card-side">
          <div class="card-front-name">Adriana Escamilla Fernández</div>
          <div class="card-front-number">970809-8489</div>
          <div class="card-front-number-xs-id">6038 0224 4731 4836</div>
          <div class="card-front-number-xs-vote">Valkod: 800085</div>
          <div class="card-front-term">HT 2025</div>
          <div class="card-front-number-due">GILTIGT TILL: 2026-02-15</div>
          <div class="card-front-number-due-mini">GILTIGT TILL: 2026-02-15</div>
          <div class="white-box-large"></div>
          <div class="white-box-mini"></div>
          <div class="white-box-small"></div>
          <div class="grey-box"></div>
          <img src="images/card-front.jpg" alt="Card Front" class="card-front-image"/>
        </div>
        <div class="card-side card-back">
            <div class="content-back">
                <img src="images/card-back.jpg" alt="Card Back" class="card-back-image"/>
            </div>
        </div>
      </div>
    </div>

    <div class="bottom-bar" role="toolbar" aria-label="Bottom actions">
      <div class="bottom-left" aria-label="Close" type="button" onclick="console.log('close clicked')">Stäng</div>

      <div class="bottom-right">
        <button class="icon-btn" aria-label="QR" type="button" onclick="console.log('QR clicked')">
          <img src="images/QR.png" alt="QR"/>
        </button>
        <button class="icon-btn" aria-label="refresh" type="button" onclick="console.log('refresh clicked')">
          <img src="images/refresh-arrow.png" alt="refresh"/>
        </button>
      </div>
    </div>
  </body>
</html>
