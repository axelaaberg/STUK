<!DOCTYPE html>
<html lang="eng">
  <head>
    <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Studentkortet" />
    <link rel="apple-touch-icon" href="icon.png" />

    <meta charset="UTF-8" />
    <title>STUK</title>
    <!-- <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js");
      }
    </script> -->


    <style>
      :root{
        --bar-height: 64px;
        --bar-bg: #ffffff;
        --bar-pad: 16px;
      }
      body {
        margin: 0;
        height: 100vh;
        background:#555555;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }


      .floating-image {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8vw;
        transform: translate(-50%, -50%);
        animation: drift 15s linear forwards;
      }

      @keyframes drift {
        to {
          transform: translate(var(--x), var(--y));
          opacity: 1;
        }
      }

      .card-container {
        perspective: 1000px;
        z-index: 1;
        /* keep the card visible above the page bottom bar */
        margin-bottom: calc(var(--bar-height) + 12px);
      }

      .card {
        width: 90vw;
        height: calc(90vw * (1047/659)); /* Relación 8:5 (alto = ancho * 8/5 ≈ 1.6) */
        max-width: calc(75vh / (1047/659)); /* que no sobrepase la pantalla */
        max-height: 75vh;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.3s;
        cursor: pointer;

      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 550;
        text-align: left;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .content-back {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: rotate(90deg);

      }

      .card-front-image {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .white-box-large {
        position: absolute;
        top: 2%;
        left: 20%;
        width: 25%;
        height: 30%;
        background-color: white;
        z-index: 2;
      }

      .white-box-mini {
        position: absolute;
        top: 2%;
        left: 13%;
        width: 7%;
        height: 14%;
        background-color: white;
        z-index: 2;
      }

      .white-box-small {
        position: absolute;
        top: 2%;
        left: 2%;
        width: 11%;
        height: 35%;
        background-color: white;
        z-index: 2;
      }

      .grey-box {
        position: absolute;
        top: 79.5%; 
        left: 25.5%; 
        width: 3%;
        height: 15.1%;
        background-color: #e4e4e2;
        z-index: 2;
      }
      

      .card-front-name {
        position: absolute;
        top: 30.3%; 
        left: 40%; 
        font-size: calc(0.83vw);
        transform: translateX(-50%) rotate(90deg);  
        z-index: 3;
        width: 85%;
      }

      .card-front-number {
        position: absolute;
        top: 30.5%; 
        left: 34%; 
        font-size: calc(0.73vw);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }


      .card-front-number-xs-id {
        position: absolute;
        top: 31.05%; 
        left: 27.5%; 
        font-size: calc(0.52vw);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }
    
      .card-front-number-xs-vote {
        position: absolute;
        top: 31.05%; 
        left: 22.5%; 
        font-size: calc(0.52vw);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

      .card-front-term {
        position: absolute;
        top: 30.5%; 
        left: 16.5%; 
        font-size: calc(0.84vw);
        transform: translateX(-50%) rotate(90deg);  
        z-index: 3;
        width: 85%;
      }
    
      .card-front-number-due {
        position: absolute;
        top: 30.8%; 
        left: 10%; 
        font-size: calc(0.68vw);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }


      .card-front-number-due-mini {
        position: absolute;
        color: #4e4e4e;
        top: 105.7%; 
        left: 27%; 
        font-size: calc(0.405vw);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }


      .card-back-image {
        transform: rotate(-90deg);
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      /* Bottom bar */
      .bottom-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--bar-height);
        background: var(--bar-bg);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 var(--bar-pad);
        z-index: 1200;

        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 450;
        
      }

      .bottom-left { 
        display: flex; 
        align-items: center; 
        gap: 12px; 
      }

      .bottom-right { 
        display: flex; 
        align-items: center; 
        gap: 12px; 
      }

      .icon-btn {
        background: transparent;
        border: none;
        padding: 6px;
        border-radius: 8px;
        cursor: pointer;
        display:flex; align-items:center; justify-content:center;
      }

      .icon-btn img { 
        width: 28px; 
        height: 28px; 
        display: block; 
      }

      .icon-btn:hover { 
        background: rgba(0,0,0,0.06); 
      }


  /*further development: 
  - consider changing to random speeds of the floaters 
  */


    </style>
  </head>
  <body>
  <script src="floaters.js"></script>

    <div class="card-container">
      <div class="card" onclick="this.classList.toggle('flipped')">
        <div class="card-side">
          <div class="card-front-name">Adriana Escamilla Fernández</div>
          <div class="card-front-number">970809-8489</div>
          <div class="card-front-number-xs-id">6038 0224 4731 4836</div>
          <div class="card-front-number-xs-vote">Valkod: 800085</div>
          <div class="card-front-term">HT 2025</div>
          <div class="card-front-number-due">GILTIGT TILL: 2026-02-15</div>
          <div class="card-front-number-due-mini">GILTIGT TILL: 2026-02-15</div>
          <div class="white-box-large"></div> 
          <div class="white-box-mini"></div>
          <div class="white-box-small"></div>
          <div class="grey-box"></div>
          <img src="images/card-front.jpg" alt="Card Front" class="card-front-image"/>
        </div>
        <div class="card-side card-back">
            <div class="content-back">
                <img src="images/card-back.jpg" alt="Card Back" class="card-back-image"/>
            </div>
        </div>
      </div>
    </div>
    
    <!-- Bottom bar: left input and two clickable icons on the right -->
    <div class="bottom-bar" role="toolbar" aria-label="Bottom actions">
      <div class="bottom-left">Stäng</div>

      <div class="bottom-right">
        <button class="icon-btn" aria-label="Help" title="Help" type="button" onclick="console.log('Help clicked')">
          <img src="images/icon.png" alt="help"/>
        </button>
        <button class="icon-btn" aria-label="Profile" title="Profile" type="button" onclick="console.log('Profile clicked')">
          <img src="images/logo-corto.png" alt="profile"/>
        </button>
      </div>
    </div>
  </body>
</html>
