<!DOCTYPE html>
<html lang="eng">
  <head>
    <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Studentkortet" />
    <link rel="apple-touch-icon" href="icon.png" />

    <meta charset="UTF-8" />
    <title>STUK</title>
    <!-- <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("service-worker.js");
      }
    </script> -->


    <style>
      body {
        margin: 0;
        height: 100vh;
        background:#555555;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }


      .floating-image {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 8vw;
        transform: translate(-50%, -50%);
        animation: drift 15s linear forwards;
      }

      @keyframes drift {
        to {
          transform: translate(var(--x), var(--y));
          opacity: 1;
        }
      }

      .card-container {
        perspective: 1000px;
        z-index: 1;
      }

      .card {
        width: 90vw;
        height: calc(90vw * (1047/659)); /* Relación 8:5 (alto = ancho * 8/5 ≈ 1.6) */
        max-width: calc(75vh / (1047/659)); /* que no sobrepase la pantalla */
        max-height: 75vh;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.3s;
        cursor: pointer;

      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .card-side {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        border-radius: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: rgba(0, 0, 0, 0.83);
        font-weight: 550;
        text-align: left;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      .content-back {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: rotate(90deg);

      }

      .card-front-image {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .white-box {
        position: absolute;
        top: 2%;
        left: 29%;
        width: 20%;
        height: 30%;
        background-color: white;
        z-index: 2;
      }

      .card-front-name {
        position: absolute;
        top: 30.3%; 
        left: 40%; /*40%*/
        font-size: calc(0.83vw);
        transform: translateX(-50%) rotate(90deg);  
        z-index: 3;
        width: 85%;
      }

      .card-front-number {
        position: absolute;
        top: 30.5%; 
        left: 34%; /*34%*/
        font-size: calc(0.73vw);
        transform: translateX(-50%) rotate(90deg);
        z-index: 3;
        width: 85%;
      }

    

      .card-back-image {
        transform: rotate(-90deg);
        width: 100%;
        height: auto;
        border-radius: 10px;
      }

  


    </style>
  </head>
  <body>
  <script src="floaters.js"></script>

    <div class="card-container">
      <div class="card" onclick="this.classList.toggle('flipped')">
        <div class="card-side">
          <div class="card-front-name">Adriana Escamilla Fernández</div>
          <div class="card-front-number">970809-8489</div>
          <div class="white-box"></div> 
          <img src="card-front.jpg" alt="Card Front" class="card-front-image"/>
        </div>
        <div class="card-side card-back">
            <div class="content-back">
                <img src="card-back.jpg" alt="Card Back" class="card-back-image"/>
            </div>
        </div>
      </div>
    </div>
  </body>
</html>
